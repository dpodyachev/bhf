<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>bhf · firmware builder (test)</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<main class="wrap">
  <h1 data-t="h1">Firmware builder</h1>
  <p class="muted" data-t="intro">Test page: choose a device and a firmware, add a text – the build runs on a separate builder, this page checks every 2 minutes and offers the download when it is ready.</p>

  <form id="f" class="card" autocomplete="off">
    <label><span data-t="device">Device</span>
      <select name="device" required>
        <option value="alexa">Amazon Alexa</option>
        <option value="tv">TV</option>
        <option value="arduino_uno">Arduino Uno</option>
        <option value="esp32" selected>ESP32</option>
        <option value="pc_x86_64">PC x86/64</option>
      </select>
    </label>
    <fieldset>
      <legend data-t="firmware">Firmware</legend>
      <label class="radio"><input type="radio" name="firmware" value="blink" checked> <span data-t="blink">Blink LED</span></label>
      <label class="radio"><input type="radio" name="firmware" value="blink_fast"> <span data-t="blink_fast">Blink LED fast</span></label>
    </fieldset>
    <label><span data-t="text">Text</span>
      <textarea name="text" rows="6" maxlength="4000" placeholder="…"></textarea>
      <small class="muted"><span id="cnt">0</span> / 4000</small>
    </label>
    <button type="submit" id="send" data-t="send">Send</button>
  </form>

  <section id="job" class="card" hidden>
    <h2 data-t="job">Build job</h2>
    <dl>
      <dt>ID</dt><dd><code id="j-id"></code></dd>
      <dt data-t="device">Device</dt><dd id="j-dev"></dd>
      <dt data-t="firmware">Firmware</dt><dd id="j-fw"></dd>
      <dt data-t="status">Status</dt><dd><b id="j-status"></b> <span id="j-msg" class="muted"></span></dd>
      <dt data-t="checked">Last check</dt><dd><span id="j-checked"></span> · <span data-t="next">next in</span> <span id="j-next"></span></dd>
    </dl>
    <p id="j-ready" hidden><a id="j-dl" class="btn" href="#" data-t="download">Download firmware</a> <span id="j-size" class="muted"></span></p>
    <p class="row">
      <button type="button" id="check" class="ghost" data-t="check">Check now</button>
      <button type="button" id="new" class="ghost" data-t="new">New job</button>
    </p>
  </section>
</main>
</body>
</html>
