# Deploy to Cloudflare Pages (project "bhf") on every push to main.
# Repository secrets needed: CLOUDFLARE_API_TOKEN (Account → Cloudflare Pages → Edit, no IP filter), CLOUDFLARE_ACCOUNT_ID
name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pages-deploy
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Hello
        run: echo "Привет Денис !"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check Cloudflare token
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '6633214019e0362137d10e619a268fd1' }}
        run: |
          T=$(printf %s "$T" | tr -d '[:space:]'); A=$(printf %s "$A" | tr -d '[:space:]')
          [ -n "$T" ] || { echo "::error::secret CLOUDFLARE_API_TOKEN is empty or missing"; exit 1; }
          echo "token: ${#T} chars, starts '${T:0:4}'"
          msg() { grep -oE '"(code|message)": *("[^"]*"|[0-9]+)' | head -4 | tr '\n' ' '; }
          V=$(curl -s https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $T")
          V2=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$A/tokens/verify" -H "Authorization: Bearer $T")
          echo "$V$V2" | grep -qE '"status": *"active"' || { echo "::error::token verify FAILED (secret has ${#T} chars, starts with '${T:0:4}' – a Cloudflare token is ~40-53 chars, no quotes, no Bearer prefix): user: $(echo "$V" | msg) account: $(echo "$V2" | msg)"; exit 1; }
          P=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$A/pages/projects/bhf" -H "Authorization: Bearer $T")
          echo "$P" | grep -qE '"success": *true' || { echo "::error::token OK, but no access to Pages project bhf: $(echo "$P" | msg) (needs Account > Cloudflare Pages > Edit on account $A, no IP filter)"; exit 1; }
          echo "::notice::Cloudflare token OK, Pages project bhf reachable"
          echo "CLOUDFLARE_API_TOKEN=$T" >> "$GITHUB_ENV"; echo "CLOUDFLARE_ACCOUNT_ID=$A" >> "$GITHUB_ENV"

      - name: Deploy
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -o pipefail
          npx -y wrangler@3.114.0 pages deploy site --project-name bhf --branch main --commit-dirty=true 2>&1 | tee wrangler.log || {
            echo "::error::wrangler: $(grep -iE 'error|fail|auth|denied|code' wrangler.log | head -6 | tr '\n' ' ' | cut -c1-800)"; exit 1; }
