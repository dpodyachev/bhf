# Deploy to Cloudflare Pages (project "bhf") on every push to main.
# Repository secrets needed: CLOUDFLARE_API_TOKEN (Account → Cloudflare Pages → Edit, no IP filter), CLOUDFLARE_ACCOUNT_ID
name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pages-deploy
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Hello
        run: echo "Привет Денис !"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '6633214019e0362137d10e619a268fd1' }}   # account ID is not a secret
          WRANGLER_SEND_METRICS: "false"
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::secret CLOUDFLARE_API_TOKEN missing"; exit 1; }
          npx -y wrangler@3.114.0 pages deploy site --project-name bhf --branch main --commit-dirty=true
